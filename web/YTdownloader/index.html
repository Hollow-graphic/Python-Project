<!DOCTYPE html>
<html lang="en">
    <body>
        <input type="text" id="videoURL" placeholder="Enter YouTube video URL">
        <button onclick="downloadVideo()">Download Video</button>
    </body>
</html>

<script>
    function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    function downloadVideo() {
        const videoURL = document.getElementById('videoURL').value;
        if (!videoURL) return;

        fetch('/YTdownloader/download', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ url: videoURL })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log('Success:', data);
        })
        .catch((error) => {
            console.error('Error:', error);
        });
    }

    // 🔹 Auto-fill depuis ?videoURL=
    const urlFromQuery = getQueryParam("videoURL");
    if (urlFromQuery) {
        document.getElementById('videoURL').value = urlFromQuery;
        downloadVideo(); // auto-download
        setTimeout(() => window.close(), 2000); // Close after 2 seconds
    }
</script>
